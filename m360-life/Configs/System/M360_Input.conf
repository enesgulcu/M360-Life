//------------------------------------------------------------------------------------------------
//! M360 Life — InputManager (urun yolu)
//!
//! BI kurali (Input Manager wiki):
//!   Action yalnizca AKTIF Context icinde islenir.
//!   Oynarken oyun zaten CharacterMovementContext aktif eder (Priority 2, Overlay).
//!
//! Bu conf:
//!   1) Parent = vanilla chimeraInputCommon (tum WASD/Inventory/Tab korunur)
//!   2) Yeni Action M360_LifeCanta = keyboard:KC_I
//!   3) CharacterMovementContext.ActionRefs +  → vanilla listeye EKLE (ustune yazma)
//!
//! YASAK: ActionInput sinifi | text "Context" (ActionContext kullan) |
//!        Overlay ozel context | Inventory hijack | InputBinding.Save
//!
//! Yeni tus: Action ekle + ActionRefs + icine adini yaz + TusYoneticisi.DinleyiciEkle
//! Guvenlik: callback yalniz UI / sunucu talebi — docs/20 §1, docs/19
//------------------------------------------------------------------------------------------------
ActionManager : "{795184CF9AD764DB}Configs/System/chimeraInputCommon.conf" {
 Actions {
  Action M360_LifeCanta {
   InputSource InputSourceSum "{ADF987310AA530E1}" {
    Sources {
     InputSourceValue "{ADF987310AA530E2}" {
      Input "keyboard:KC_I"
     }
    }
   }
  }
 }
 Contexts {
  ActionContext CharacterMovementContext {
   ActionRefs +{
    "M360_LifeCanta"
   }
  }
 }
}
